[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.2",
    "pydantic==2.9.2",
    "SQLAlchemy==2.0.36",
    "httpx==0.27.0",
    "PyJWT==2.9.0",
    "cryptography==44.0.0",
    "python-multipart==0.0.12",
]
[project.optional-dependencies]
test = ["pytest==8.3.4", "pytest-asyncio==0.24.0"]
