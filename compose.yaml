version: '3.8'

services:
  # Backend API (SQLite + Demo mode for local development)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lumen-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:///data/lumen.db
      OIDC_ENABLED: "false"
      LUMEN_DEMO_MODE: "true"
      LUMEN_DEMO_USER_EMAIL: demo@localhost
      LUMEN_DEMO_USER_NAME: Demo User
      LUMEN_DEMO_USER_ROLE: operator
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_MODEL: ${LLM_MODEL:-gpt-4}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
      LUMEN_SECRET_KEY: ${LUMEN_SECRET_KEY:-changeme}
      LUMEN_DEBUG: "false"
      HOST: "0.0.0.0"
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - lumen-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lumen-network
    depends_on:
      - keycloak

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: lumen-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    networks:
      - lumen-network

  # Keycloak Identity Provider (OIDC)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: lumen-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      KC_DB: dev-file
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - lumen-network

volumes:
  lumen-data:
    driver: local
  keycloak-data:
    driver: local

networks:
  lumen-network:
    driver: bridge
