version: '3.8'

services:
  # Backend API (SQLite + Demo mode for local development)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lumen-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:///data/lumen.db
      OIDC_ENABLED: "false"
      LUMEN_DEMO_MODE: "true"
      LUMEN_DEMO_USER_EMAIL: demo@localhost
      LUMEN_DEMO_USER_NAME: Demo User
      LUMEN_DEMO_USER_ROLE: operator
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_MODEL: ${LLM_MODEL:-gpt-4}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
      LUMEN_SECRET_KEY: ${LUMEN_SECRET_KEY:-changeme}
      LUMEN_DEBUG: "false"
      HOST: "0.0.0.0"
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - lumen-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lumen-network

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: lumen-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    networks:
      - lumen-network

volumes:
  lumen-data:
    driver: local

networks:
  lumen-network:
    driver: bridge